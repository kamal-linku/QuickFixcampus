name: Build QuickFix Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet flet-cli

      - name: Build Android APK with Flet
        run: |
          if [ -d "quickfix" ]; then cd quickfix; fi
          flet build apk --project-name quickfix --build-version 1.0.0 --build-number 1 --no-rich-output --yes

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: quickfix-android-apk
          path: "**/build/apk/*.apk"
          retention-days: 14
